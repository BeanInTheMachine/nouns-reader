name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Make gradlew executable
        working-directory: apps/example-native/android
        run: chmod +x gradlew

      - name: Build Android release APK
        working-directory: apps/example-native/android
        run: ./gradlew assembleRelease -PhermesEnabled=false -x lintVitalRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nouns-reader-apk
          path: apps/example-native/android/app/build/outputs/apk/release/app-release.apk
